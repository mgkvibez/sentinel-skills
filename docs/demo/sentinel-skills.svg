<svg xmlns="http://www.w3.org/2000/svg" width="980" height="510" viewBox="0 0 980 510" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
<defs><linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#11161d"/><stop offset="1" stop-color="#0b0f14"/></linearGradient></defs>
<rect width="980" height="510" rx="12" fill="url(#bg)"/>
<rect width="980" height="42" rx="12" fill="#161d26"/>
<rect y="30" width="980" height="12" fill="#161d26"/>
<circle cx="22" cy="21" r="6" fill="#ff5f57"/><circle cx="44" cy="21" r="6" fill="#febc2e"/><circle cx="66" cy="21" r="6" fill="#28c840"/>
<text x="490.0" y="26" fill="#7d8794" font-size="12" text-anchor="middle">sentinel-skills · validate + threat model</text>
<text x="24" y="64" fill="#4fd18b" font-size="13">$ npx skills add mgkvibez/sentinel-skills</text>
<text x="24" y="88" fill="#4fd18b" font-size="13" xml:space="preserve">$ python scripts/validate_skills.py --strict</text>
<text x="24" y="108" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="128" fill="#4fd18b" font-size="13" xml:space="preserve">5/5 skills valid</text>
<text x="24" y="148" fill="#4fd18b" font-size="13" xml:space="preserve">all checks passed</text>
<text x="24" y="168" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="188" fill="#4fd18b" font-size="13" xml:space="preserve">$ head -6 examples/threat-model-migsafe.md</text>
<text x="24" y="208" fill="#d7dde5" font-size="13" xml:space="preserve"># Threat model: migsafe (applied with skills/threat-model)</text>
<text x="24" y="228" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="248" fill="#d7dde5" font-size="13" xml:space="preserve">Worked example: the threat-model skill run against a real CLI that reads SQL files.</text>
<text x="24" y="268" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="288" fill="#d7dde5" font-size="13" xml:space="preserve">## 1. What we are protecting</text>
<text x="24" y="308" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="328" fill="#d7dde5" font-size="13" xml:space="preserve">- **Integrity of the migration files** being linted: the tool must never rewrite SQL it inspects.</text>
<text x="24" y="348" fill="#d7dde5" font-size="13" xml:space="preserve">- **Developer trust in a finding**: a missed lock is a production outage; a false alarm is a deleted</text>
<text x="24" y="368" fill="#d7dde5" font-size="13" xml:space="preserve">   check.</text>
<text x="24" y="388" fill="#d7dde5" font-size="13" xml:space="preserve">- **No secret leakage**: migrations can contain credentials in DEFAULTs or comments.</text>
<text x="24" y="408" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="428" fill="#d7dde5" font-size="13" xml:space="preserve">## 2. Assets and entry points</text>
<text x="24" y="448" fill="#d7dde5" font-size="13" xml:space="preserve"></text>
<text x="24" y="468" fill="#d7dde5" font-size="13" xml:space="preserve">| Asset | Entry point | Notes |</text>
<text x="24" y="488" fill="#d7dde5" font-size="13" xml:space="preserve">|---|---|---|</text>
</svg>